apiVersion: v1
kind: Service
metadata:
  labels:
    {{- include "loongcollector-operator.labels" . | nindent 4 }}
  name: {{ include "loongcollector-operator.fullname" . }}-webhook-service
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - port: 443
      protocol: {{ .Values.operator.webhookService.protocol }}
      targetPort: {{ .Values.operator.webhookService.port }}
  type: {{ .Values.operator.webhookService.type }}
  selector:
    {{- include "loongcollector-operator.selectorLabels" . | nindent 6 }}



------
apiVersion: v1
kind: Service
metadata:
  name: {{ include "loongcollector-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - port: {{ .Values.operator.service.port }}
      protocol: {{ .Values.operator.service.protocol }}
      targetPort: {{ .Values.operator.service.port }}
      name: operator-service
  type: {{ .Values.operator.service.type }}
  selector:
    {{- include "loongcollector-operator.selectorLabels" . | nindent 6 }}

------
apiVersion: v1
kind: Service
metadata:
  name: loongcollector-singleton
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - port: {{ .Values.singletonAgent.service.port }}
      protocol: {{ .Values.singletonAgent.service.protocol }}
      targetPort: {{ .Values.singletonAgent.service.port }}
      name: singleton-service
  type: {{ .Values.singletonAgent.service.type }}
  selector:
    k8s-app: loongcollector-singleton

---
apiVersion: v1
kind: Service
metadata:
  name: loongcollector-cluster
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - name: loongcollector-cluster-endpoint
      port: 18689
      protocol: TCP
      targetPort: 18689
    - name: skywalking-v3
      port: 11800
      protocol: TCP
      targetPort: 11800
    - name: skywalking-v2
      port: 21800
      protocol: TCP
      targetPort: 21800
  selector:
    k8s-app: loongcollector-cluster
  type: ClusterIP

---