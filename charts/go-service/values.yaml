# -- Logical service name used for Kubernetes resource naming and labels.
serviceName: ""

replicaCount: 1

image:
  repository: ""
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  # -- Create a dedicated ServiceAccount for the workload.
  create: true
  # -- Override the generated ServiceAccount name.
  name: ""
  annotations: {}

containerPorts:
  http: 8080
  grpc: 5001

probes:
  liveness:
    enabled: true
    path: /healthz
    # -- Probe port selector: "http" or "grpc".
    port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    path: /readyz
    # -- Probe port selector: "http" or "grpc".
    port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

configFile:
  enabled: false
  name: config.yml
  mountPath: /app/config.yml
  content: {}

externalSecret:
  enabled: false
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  targetSecretName: ""
  refreshInterval: 1h
  # Sync all keys from this Vault path into the target Secret.
  remoteRef:
    key: ""
  # Optional explicit key mapping. When non-empty, overrides remoteRef extract mode.
  data: []

envFromSecret:
  enabled: false
  secretName: ""

service:
  type: ClusterIP
  ports:
    http: 8080
    grpc: 5001

podAnnotations: {}
podLabels: {}

nodeSelector: {}
tolerations: []
affinity: {}
