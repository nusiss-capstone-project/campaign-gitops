apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-usergroup-job
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nusiss-capstone-project/campaign-gitops.git
    targetRevision: demo
    path: apps/usergroup-job
  destination:
    server: https://kubernetes.default.svc
    namespace: campaign-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
