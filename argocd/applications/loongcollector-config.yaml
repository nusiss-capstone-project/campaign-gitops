apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loongcollector-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/nusiss-capstone-project/campaign-gitops.git
    targetRevision: dev
    path: platform/loongcollector
    directory:
      recurse: true
      exclude: "{values.yaml,README.md}"
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
