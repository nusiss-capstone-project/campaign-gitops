apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loongcollector-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/nusiss-capstone-project/campaign-gitops.git
    targetRevision: dev
    path: platform/loongcollector
    directory:
      recurse: true
      exclude: "{values.yaml,README.md}"
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Required for ignoreDifferences to clear OutOfSync with auto-sync.
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jsonPointers:
        - /status
        - /metadata/annotations
        - /metadata/managedFields
    - group: ""
      kind: Secret
      name: loongcollector-sls-credentials
      jsonPointers:
        - /data
        - /metadata/annotations
        - /metadata/labels
        - /metadata/managedFields
        - /metadata/ownerReferences
    - group: telemetry.alibabacloud.com
      kind: ClusterAliyunPipelineConfig
      jsonPointers:
        - /status
        - /metadata/generation
        - /metadata/annotations
        - /metadata/managedFields
        - /metadata/finalizers
