apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo1-identity-mservice
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nusiss-capstone-project/campaign-gitops.git
    targetRevision: demo1
    path: charts/go-service
    helm:
      valueFiles:
        - ../../apps/identity-mservice/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: campaign-demo1
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
