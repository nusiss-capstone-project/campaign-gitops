serviceName: identity-mservice

image:
  repository: crpi-m8e4ka9sicipqhhl.ap-southeast-1.personal.cr.aliyuncs.com/campaign-center/identity-mservice
  tag: dev-202608011244
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: acr-secret

replicaCount: 1

containerPorts:
  http: 8080
  grpc: 5001

probes:
  liveness:
    path: /identity-ms/v1/ping
  readiness:
    path: /identity-ms/v1/ping

configFile:
  enabled: true
  name: config.yml
  mountPath: /app/resources/config.yml
  content:
    grpc:
      host: "0.0.0.0"
      port: 5001
      connect_timeout: 3
      max_pool_size: 200
    http:
      host: "0.0.0.0"
      port: 8080
    log:
      level: debug
      file_path: ./logs/identity-mservice.log
    system:
      allowed_origins:
        - https://campaign-center-admin-web.vercel.app
        - https://finverse-web.vercel.app
        - http://localhost:3000
      post_kyc_redirect_uri: "https://finverse-web.vercel.app/profile"
    singpass:
      redirect_uri: "http://campaignhub.best/identity-ms/v1/kyc/singpass/callback"
      scope: "openid name email uinfin mobileno"
      issuer_url: "http://campaignhub.best/mockpass/singpass/v2"
      assertion_aud: "http://mockpass.mockpass.svc.cluster.local:5156/singpass/v2"
      token_url: "http://mockpass.mockpass.svc.cluster.local:5156/singpass/v2/token"
      user_info_url: "http://mockpass.mockpass.svc.cluster.local:5156/singpass/v2/userinfo"
      jwks_uri: "http://mockpass.mockpass.svc.cluster.local:5156/singpass/v2/.well-known/keys"
    kafka:
      enabled: true
      brokers:
        - kafka.messaging.svc.cluster.local:9092
      client_id: identity-mservice

externalSecret:
  enabled: true
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  targetSecretName: identity-mservice-secret
  refreshInterval: 1h
  remoteRef:
    key: campaign-center/dev/identity-mservice

envFromSecret:
  enabled: true
  secretName: identity-mservice-secret

service:
  type: ClusterIP
  ports:
    http: 8080
    grpc: 5001

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
