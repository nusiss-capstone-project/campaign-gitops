apiVersion: apps/v1
kind: Deployment
metadata:
  name: mockpass
  namespace: mockpass
  labels:
    app.kubernetes.io/name: mockpass
    app.kubernetes.io/part-of: campaign-center
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mockpass
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mockpass
    spec:
      containers:
        - name: mockpass
          image: opengovsg/mockpass:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5156
              protocol: TCP
          env:
            - name: MOCKPASS_PORT
              value: "5156"
            - name: SHOW_LOGIN_PAGE
              value: "true"
            - name: MOCKPASS_STATELESS
              value: "true"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mockpass
  namespace: mockpass
  labels:
    app.kubernetes.io/name: mockpass
    app.kubernetes.io/part-of: campaign-center
    app.kubernetes.io/managed-by: argocd
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mockpass
  ports:
    - name: http
      port: 5156
      targetPort: http
      protocol: TCP
---
# Strip only for API routes. Static assets are served by MockPass itself at
# /mockpass/resources/... (see public/mockpass/resources and login-page.html).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: mockpass-strip-prefix
  namespace: mockpass
  labels:
    app.kubernetes.io/name: mockpass
    app.kubernetes.io/part-of: campaign-center
    app.kubernetes.io/managed-by: argocd
spec:
  stripPrefix:
    prefixes:
      - /mockpass
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mockpass-http
  namespace: mockpass
  labels:
    app.kubernetes.io/name: mockpass
    app.kubernetes.io/part-of: campaign-center
    app.kubernetes.io/managed-by: argocd
spec:
  entryPoints:
    - web
  routes:
    # Static assets: keep /mockpass prefix (MockPass expects /mockpass/resources/...)
    - match: Host(`campaignhub.best`) && PathPrefix(`/mockpass/resources`)
      kind: Rule
      priority: 100
      services:
        - name: mockpass
          port: 5156

    # API routes: strip /mockpass so MockPass receives /singpass/... /corppass/... etc.
    - match: Host(`campaignhub.best`) && (PathPrefix(`/mockpass/singpass`) || PathPrefix(`/mockpass/corppass`) || PathPrefix(`/mockpass/myinfo`) || PathPrefix(`/mockpass/sgid`) || PathPrefix(`/mockpass/sign-v3`) || PathPrefix(`/mockpass/fapi`) || PathPrefix(`/mockpass/v2`))
      kind: Rule
      priority: 90
      middlewares:
        - name: mockpass-strip-prefix
      services:
        - name: mockpass
          port: 5156
