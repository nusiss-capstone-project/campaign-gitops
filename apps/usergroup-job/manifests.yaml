apiVersion: v1
kind: ServiceAccount
metadata:
  name: usergroup-job
  namespace: campaign-dev
  labels:
    app.kubernetes.io/name: usergroup-job
    app.kubernetes.io/part-of: campaign-center
    app.kubernetes.io/managed-by: argocd
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: usergroup-job-config
  namespace: campaign-dev
  labels:
    app.kubernetes.io/name: usergroup-job
    app.kubernetes.io/part-of: campaign-center
    app.kubernetes.io/managed-by: argocd
data:
  config.yml: |
    log:
      level: debug
      file_path: ./logs/usergroup-job.log
    sync:
      batch_size: 500
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: usergroup-job-external-secret
  namespace: campaign-dev
  labels:
    app.kubernetes.io/name: usergroup-job
    app.kubernetes.io/part-of: campaign-center
    app.kubernetes.io/managed-by: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: usergroup-job-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: campaign-center/dev/usergroup-job
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: usergroup-job
  namespace: campaign-dev
  labels:
    app.kubernetes.io/name: usergroup-job
    app.kubernetes.io/part-of: campaign-center
    app.kubernetes.io/managed-by: argocd
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: usergroup-job
        spec:
          serviceAccountName: usergroup-job
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: acr-secret
          containers:
            - name: usergroup-job
              image: crpi-m8e4ka9sicipqhhl.ap-southeast-1.personal.cr.aliyuncs.com/campaign-center/usergroup-mservice:job-dev-202608060721
              imagePullPolicy: IfNotPresent
              envFrom:
                - secretRef:
                    name: usergroup-job-secret
              volumeMounts:
                - name: config
                  mountPath: /app/resources/config.yml
                  subPath: config.yml
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
          volumes:
            - name: config
              configMap:
                name: usergroup-job-config
