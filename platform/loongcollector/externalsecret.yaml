# Sync SLS credentials from Vault into kube-system for LoongCollector DaemonSet/Operator.
# Vault path: secret/campaign-center/dev/loongcollector
# Keys: ACCESS_KEY_ID, ACCESS_KEY_SECRET, ALI_UID
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loongcollector-sls-credentials
  namespace: kube-system
  labels:
    app.kubernetes.io/name: loongcollector
    app.kubernetes.io/part-of: campaign-center
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: loongcollector-sls-credentials
    creationPolicy: Owner
  data:
    - secretKey: access-key-id
      remoteRef:
        key: campaign-center/dev/loongcollector
        property: ACCESS_KEY_ID
    - secretKey: access-key-secret
      remoteRef:
        key: campaign-center/dev/loongcollector
        property: ACCESS_KEY_SECRET
