# Collect container stdout/stderr from campaign-demo → SLS Logstore.
# Reuses the same SLS project / machine group as campaign-dev; filter by namespace in SLS.
#
# Prerequisite: SLS user-defined machine group k8s-group-campaign-k3s-dev heartbeat OK.
apiVersion: telemetry.alibabacloud.com/v1alpha1
kind: ClusterAliyunPipelineConfig
metadata:
  name: campaign-demo-stdout
  labels:
    app.kubernetes.io/name: loongcollector
    app.kubernetes.io/part-of: campaign-center
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project:
    name: log-service-1558398056044027-ap-southeast-1
  logstores:
    - name: k8s-campaign-center-stdout-dev
  machineGroups:
    - name: k8s-group-campaign-k3s-dev
  config:
    inputs:
      - Type: input_container_stdio
        IgnoringStderr: false
        IgnoringStdout: false
        ContainerFilters:
          K8sNamespaceRegex: ^campaign-demo$
    processors:
      - Type: processor_parse_json_native
        SourceKey: content
        KeepingSourceWhenParseFail: true
        KeepingSourceWhenParseSucceed: true
    flushers:
      - Type: flusher_sls
        Logstore: k8s-campaign-center-stdout-dev
