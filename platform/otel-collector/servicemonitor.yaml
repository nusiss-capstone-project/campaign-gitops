# Scrapes OTel Collector spanmetrics Prometheus exporter.
# Confirmed from this repo's manifests (not guessed from an external cluster):
#   namespace: monitoring
#   service: otel-collector
#   port name: metrics (8889)
#   path: /metrics (prometheus exporter default)
#   selector labels: app.kubernetes.io/name=otel-collector
#   release label: kube-prometheus-stack (matches kube-prometheus-stack helm release)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: otel-collector-spanmetrics
  namespace: monitoring
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: campaign-center
    app.kubernetes.io/component: otel-collector
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  namespaceSelector:
    matchNames:
      - monitoring
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
