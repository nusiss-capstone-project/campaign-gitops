# Scrapes OTel Collector spanmetrics Prometheus exporter.
# Prometheus Operator is installed from the IaC repo (Ansible), not ArgoCD.
#   namespace: monitoring
#   service: otel-collector
#   port name: metrics (8889)
#   path: /metrics
#   release label: must match the Ansible helm release serviceMonitorSelector
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: otel-collector-spanmetrics
  namespace: monitoring
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: campaign-center
    app.kubernetes.io/component: otel-collector
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  namespaceSelector:
    matchNames:
      - monitoring
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
