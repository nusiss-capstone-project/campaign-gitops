apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  namespace: monitoring
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: campaign-center
    app.kubernetes.io/component: otel-collector
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        send_batch_size: 256
        timeout: 5s
      memory_limiter:
        check_interval: 2s
        limit_mib: 256
        spike_limit_mib: 64

    connectors:
      spanmetrics:
        namespace: traces.span.metrics
        histogram:
          explicit:
            buckets: [2ms, 5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s]
        dimensions:
          - name: http.method
          - name: http.status_code
          - name: http.route
          - name: service.name
        dimensions_cache_size: 1000
        exemplars:
          enabled: false

    exporters:
      prometheus:
        endpoint: 0.0.0.0:8889
        namespace: otelcol
        const_labels:
          collector: campaign-otel
      debug:
        verbosity: basic

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [spanmetrics, debug]
        metrics/spanmetrics:
          receivers: [spanmetrics]
          processors: [memory_limiter, batch]
          exporters: [prometheus]
