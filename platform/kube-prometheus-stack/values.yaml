# Demo-oriented kube-prometheus-stack (monitoring namespace).
# Chart: prometheus-community/kube-prometheus-stack@72.9.1
#
# ArgoCD sync CPU is dominated by Grafana dashboard ConfigMaps and default
# PrometheusRules — those are disabled here. Runtime targets OTel ServiceMonitor.

fullnameOverride: ""
fullnameOverride: ""

crds:
  enabled: true

alertmanager:
  enabled: false

prometheus-node-exporter:
  enabled: false

nodeExporter:
  enabled: false

kubeEtcd:
  enabled: false

kubeProxy:
  enabled: false

kubeScheduler:
  enabled: false

kubeControllerManager:
  enabled: false

kubeApiServer:
  enabled: false

coreDns:
  enabled: false

kubeDns:
  enabled: false

kubelet:
  enabled: true
  serviceMonitor:
    cAdvisor: false
    probes: true
    resource: true

# Dozens of PrometheusRule CRs — major sync cost; not needed for demo metrics.
defaultRules:
  create: false

grafana:
  enabled: true
  adminUser: admin
  adminPassword: campaign-demo
  # Huge ConfigMaps; biggest ArgoCD/repo-server CPU spike during sync.
  defaultDashboardsEnabled: false
  forceDeployDashboards: false
  sidecar:
    dashboards:
      enabled: false
    datasources:
      enabled: true
  ingress:
    enabled: false
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  service:
    type: ClusterIP
    port: 80

prometheusOperator:
  # Admission webhook Jobs are ArgoCD PreSync/PostSync hooks; on small k3s they
  # often hang ("waiting for admission-create"). Disable for demo — not needed
  # to scrape OTel ServiceMonitors.
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

prometheus:
  enabled: true
  prometheusSpec:
    retention: 3d
    scrapeInterval: 30s
    evaluationInterval: 30s
    serviceMonitorSelectorNilUsesHelmValues: true
    podMonitorSelectorNilUsesHelmValues: true
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 400m
        memory: 768Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
