# Grafana UI for demo monitoring stack.
# Service name follows kube-prometheus-stack helm release naming.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: campaign-center
    app.kubernetes.io/managed-by: argocd
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`grafana.campaignhub.best`)
      kind: Rule
      services:
        - name: kube-prometheus-stack-grafana
          port: 80
