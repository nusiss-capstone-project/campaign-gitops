# Shared Traefik HTTP routes for Campaign Center microservices.
# Deployed to the app namespace (e.g. campaign-dev) because Traefik disallows
# cross-namespace service references by default on k3s.
#
# One host per environment; route by path prefix:
#   /task-ms              -> task-mservice
#   /campaign-center-api  -> campaign-center-api
#   /reward-service       -> reward-service (future)
#
# Branch strategy: dev / staging / main each carry their own ingressroute.yaml.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: campaign-center-http
  namespace: campaign-dev
  labels:
    app.kubernetes.io/part-of: campaign-center
    app.kubernetes.io/managed-by: argocd
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`campaignhub.best`) && PathPrefix(`/task-ms`)
      kind: Rule
      services:
        - name: task-mservice
          port: 8080
    - match: Host(`campaignhub.best`) && PathPrefix(`/campaign-center-api`)
      kind: Rule
      services:
        - name: campaign-center-api
          port: 8080
