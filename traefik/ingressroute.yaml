# Shared Traefik HTTP routes for Campaign Center demo microservices.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: campaign-center-http
  namespace: campaign-demo
  labels:
    app.kubernetes.io/part-of: campaign-center
    app.kubernetes.io/managed-by: argocd
spec:
  entryPoints:
    - web
    - websecure
  tls:
    secretName: campaignhub-origin-tls
  routes:
    - match: Host(`demo.campaignhub.best`) && PathPrefix(`/task-ms`)
      kind: Rule
      middlewares:
        - name: identity-forward-auth
      services:
        - name: task-mservice
          port: 8080
    - match: Host(`demo.campaignhub.best`) && PathPrefix(`/campaign-center-api`)
      kind: Rule
      middlewares:
        - name: identity-forward-auth
      services:
        - name: campaign-center-api
          port: 8080
    - match: Host(`demo.campaignhub.best`) && PathPrefix(`/reward-ms`)
      kind: Rule
      middlewares:
        - name: identity-forward-auth
      services:
        - name: reward-mservice
          port: 8080
    - match: Host(`demo.campaignhub.best`) && PathPrefix(`/payment-ms`)
      kind: Rule
      middlewares:
        - name: identity-forward-auth
      services:
        - name: payment-mservice
          port: 8080
    - match: Host(`demo.campaignhub.best`) && PathPrefix(`/asset-ms`)
      kind: Rule
      middlewares:
        - name: identity-forward-auth
      services:
        - name: asset-mservice
          port: 8080
    - match: Host(`demo.campaignhub.best`) && PathPrefix(`/usergroup-ms`)
      kind: Rule
      middlewares:
        - name: identity-forward-auth
      services:
        - name: usergroup-mservice
          port: 8080
    # Browser identity/KYC stays on campaign-dev (Singpass/Clerk callbacks).
    - match: Host(`demo.campaignhub.best`) && PathPrefix(`/identity-ms`)
      kind: Rule
      services:
        - name: identity-mservice
          namespace: campaign-dev
          port: 8080
