# ForwardAuth: Traefik calls identity-mservice with the client Authorization header,
# copies X-Internal-User-Id / X-User-Role onto the upstream request, then continues.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: identity-forward-auth
  namespace: campaign-dev
  labels:
    app.kubernetes.io/part-of: campaign-center
    app.kubernetes.io/managed-by: argocd
spec:
  forwardAuth:
    # In-cluster only: /auth/forward is gated by RequireInternalNetwork.
    address: http://identity-mservice.campaign-dev.svc.cluster.local:8080/auth/forward
    authRequestHeaders:
      - Authorization
    authResponseHeaders:
      - X-Internal-User-Id
      - X-User-Role
