# ForwardAuth: Traefik calls campaign-dev identity-mservice (shared auth),
# copies X-Internal-User-Id / X-User-Role onto the upstream request, then continues.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: identity-forward-auth
  namespace: campaign-demo
  labels:
    app.kubernetes.io/part-of: campaign-center
    app.kubernetes.io/managed-by: argocd
spec:
  forwardAuth:
    # Shared with campaign-dev — do not point at campaign-demo identity.
    address: http://identity-mservice.campaign-dev.svc.cluster.local:8080/auth/forward
    authRequestHeaders:
      - Authorization
    authResponseHeaders:
      - X-Internal-User-Id
      - X-User-Role
